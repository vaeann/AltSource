name: 更新软件源

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.toml'
      - 'zh.json'
      - 'build.py'

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 合并所有上游源
        run: python build.py --refresh

      - name: 提交变更
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json _incoming
          if git diff --cached --quiet; then
            echo "上游没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 同步上游最新版本 [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送冲突，拉取后重试（第 $i 次）"
            git pull --rebase origin main || true
          done
          echo "推送失败"
          exit 1
