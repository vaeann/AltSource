# 源信息
[source]
name = "我的软件源"
subtitle = "精挑细选的 iOS 侧载应用合集 · 自动同步上游"
description = "把多个优质 AltStore / SideStore 源去重合并成一个。所有应用均来自上游开源项目或官方发布渠道，本源只做汇总与中文化，不修改任何安装包。\n\n包含模拟器、影音、漫画、开发工具、系统增强等类别。"
identifier = "com.vaeann.source"
icon_url = "https://github.com/vaeann.png?size=256"
website = "https://github.com/vaeann"
tint_color = "#6B4EFF"

# 每个应用保留几个历史版本
keep_versions = 3

# 上游源，顺序越靠前，去重时越优先（版本数相同时）
[[upstream]]
label = "INSAV 官方"
url = "https://raw.githubusercontent.com/ios151/Insav-releases/main/altsource.json"

[[upstream]]
label = "WQ Files 官方"
url = "https://raw.githubusercontent.com/kolbicz/WQFiles/main/source.json"

[[upstream]]
label = "Camlo 官方"
url = "https://raw.githubusercontent.com/Kianuni/Camlo/main/apps.json"

[[upstream]]
label = "Laincat 工具箱"
url = "https://raw.githubusercontent.com/laincat/AltStore/main/apps.json"

[[upstream]]
label = "JiPengLin 精选"
url = "https://JiPengLin.github.io/custom-sidestore-repo/apps.json"

[[upstream]]
label = "AltGallery"
url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/all-apps.json"
