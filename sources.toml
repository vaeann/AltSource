# 每个应用保留几个历史版本
keep_versions = 3
# 名称或 bundle id 里带 Beta 的条目直接跳过，避免把测试版当成正式版
exclude_beta = true
# 是否收录官方仓库的「预发布版」（v2.2.0-pre.1 这类）。
# 开：作者发了 pre 版就能第一时间拿到（tag 里的后缀不影响真实版本号）
# 关：只收 GitHub 标记为正式版的 Release
include_prerelease = true

# 不收录的应用（按 bundle id）。想恢复某个应用，把对应行删掉再重跑即可
exclude = [
  # A 档：长期停更或功能完全重复
  "me.oatmealdome.dolphinios-njb",   # DolphiniOS：稳定版停在 2022 年
  "com.rileytestut.Clip",            # Clip：1.4 年没更新，系统自带够用
  "com.github.kiastr.venera-ssr",    # Venera-SSR：Venera 系已有 4 个，它最弱
  "com.miguel.psx3ios",              # PSX3IOS：PS3 已有 ARMSX3
  "com.laincat.nekularity",          # Nekularity：Venera 内核，纯重复
  # B 档：同类里重复度高的
  "com.armsx2.ios.nightly",          # ARMSX2 Nightly：和 ARMSX2 同仓库
  "moye.PicaX",                      # PicaX：漫画类已足够多
  "software.iridium",                # Iridium：Windows 运行时已有 4 个
  "app.fathom.emulator",             # Fathom：x86 模拟器，UTM/Orchard 可覆盖
  "com.leviidev.podium",             # Podium：iPod Touch 模拟器，玩票性质
  "com.silverphase.editor",          # Silverphase：胶片模拟，很小众
  "com.rushhours.app",               # Rush Hours：小游戏
  "org.moviepilot.app",              # MoviePilot：已有 MoviePilotLite
  # 2026-11-22：知乎作者改过包名，官方源里是 com.huamurui，旧包名 com.huamu013 排除
  "com.huamu013.ZhihuMinusMinus",
  # 2026-11-18 老板点名删除
  "com.rileytestut.AltStore",        # AltStore：需要 AltServer 配合，源里已有 SideStore
  "com.rileytestut.AltStore.Beta",   # 上面那条的 beta 通道，防止顶位
  "com.kdt.livecontainer",           # LiveContainer+SideStore：已经在用，不需要装在容器里
  # 上面几个应用在上游还有 beta 通道的独立条目，稳定版删掉后会顶上来，一并排除
  "com.rileytestut.Clip.Beta",
  "me.oatmealdome.DolphiniOS-njb-patreon-beta",
]

# 源信息
[source]
name = "我的软件源"
subtitle = "精挑细选的 iOS 侧载应用合集 · 自动同步上游"
description = "把多个优质 AltStore / SideStore 源去重合并成一个。所有应用均来自上游开源项目或官方发布渠道，本源只做汇总与中文化，不修改任何安装包。\n\n包含模拟器、影音、漫画、开发工具、系统增强等类别。"
identifier = "com.vaeann.source"
icon_url = "https://github.com/vaeann.png?size=256"
website = "https://github.com/vaeann"
tint_color = "#6B4EFF"

